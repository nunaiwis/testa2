<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>❤️ 给 玉簪 的告白 ❤️</title>

<style>
html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family: Arial;
}

/* 背景 */
body{
    background:url('https://i.pinimg.com/1200x/bd/68/94/bd689499cff15b162c878abe1b346406.jpg') center/cover no-repeat;
    color:#fff;
    text-align:center;
}

/* 暗层 */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.45);
    z-index:1;
}

/* 内容 */
.container{
    position:relative;
    z-index:2;
    top:20vh;
    padding:20px;
}

h1{
    font-size:40px;
}

#text{
    font-size:20px;
    margin-top:15px;
}

#timer{
    margin-top:10px;
    color:pink;
}

/* 图片 */
img{
    width:200px;
    border-radius:15px;
    margin-top:20px;
}

/* 烟花 */
canvas{
    position:fixed;
    inset:0;
    z-index:0;
}

/* 爱心漂浮 */
.heart{
    position:fixed;
    bottom:-20px;
    color:pink;
    font-size:20px;
    animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
    from{transform:translateY(0);opacity:1;}
    to{transform:translateY(-100vh);opacity:0;}
}

/* 播放按钮 */
#btn{
    position:fixed;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:5;
    padding:12px 20px;
    border:none;
    border-radius:20px;
    background:#ff4d6d;
    color:#fff;
    font-size:16px;
}
</style>
</head>

<body>

<canvas id="fire"></canvas>
<div class="overlay"></div>

<div class="container">
    <h1>❤️ I LOVE YOU ❤️</h1>
    <div id="text"></div>
    <div id="timer"></div>

    <img src="./images/photo_2026-08-19_13-26-09.jpg">
</div>

<!-- 音乐 -->
<audio id="music" loop preload="auto">
    <source id="musicSource" src="music.mp3">
</audio>

<button id="btn" onclick="startAll()">🎵 点击进入浪漫模式</button>

<script>
/* ========= 打字机 ========= */
const msg="玉簪，从遇见你的那一刻起，我的世界只剩你 ❤️";
let i=0;
function typing(){
    if(i<msg.length){
        document.getElementById("text").innerHTML+=msg[i++];
        setTimeout(typing,80);
    }
}
typing();

/* ========= 计时 ========= */
const start=new Date("2026-07-19");
setInterval(()=>{
    let d=Math.floor((Date.now()-start)/86400000);
    document.getElementById("timer").innerHTML="我们已经相遇 "+d+" 天 ❤️";
},1000);

/* ========= 烟花 ========= */
const c=document.getElementById("fire");
const ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

function fire(){
    let x=Math.random()*c.width;
    let y=Math.random()*c.height/2;
    for(let i=0;i<60;i++){
        ctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;
        ctx.beginPath();
        ctx.arc(x+Math.random()*60,y+Math.random()*60,2,0,Math.PI*2);
        ctx.fill();
    }
}
setInterval(()=>{ctx.clearRect(0,0,c.width,c.height);fire();},500);

/* ========= 爱心雨 ========= */
function heartRain(){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),6000);
}
setInterval(heartRain,300);

/* ========= 音乐核心（自动解锁） ========= */
function startMusic(){
    const music=document.getElementById("music");

    // 尝试播放（浏览器限制必须由点击触发）
    music.play().catch(()=>{});
}

/* ========= 全部启动 ========= */
function startAll(){
    startMusic();
    document.getElementById("btn").style.display="none";
}

/* ========= 自动尝试播放 ========= */
window.addEventListener("load",()=>{
    const music=document.getElementById("music");
    music.volume=0.8;

    let tryPlay=setInterval(()=>{
        music.play().then(()=>{
            clearInterval(tryPlay);
        }).catch(()=>{});
    },1000);
});
</script>

</body>
</html>
